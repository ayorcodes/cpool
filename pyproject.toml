[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cpool = "cpool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpool"]

[tool.hatch.build.targets.wheel.force-include]
"plugin" = "cpool/plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
